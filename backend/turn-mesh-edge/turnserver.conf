# ═══════════════════════════════════════════════════════════════════════════════
# VEIL ZERO-LOG COTURN RELAY CONFIGURATION
# Production RFC 5389 / RFC 5766 TURN/STUN Edge Server
# ═══════════════════════════════════════════════════════════════════════════════

# ---- Zero Disk-Logging (Strict Ephemeral Privacy) ---------------------------
# Disable all standard output logs, syslog, and file-based logging
no-stdout-log
log-file=/dev/null
no-syslog

# ---- Network & Listening Ports ----------------------------------------------
# Standard STUN/TURN UDP & TCP
listening-port=3478
alt-listening-port=80

# TLS 1.3 TURNS on Port 443 (Bypasses stateful CGNAT & deep packet inspection)
tls-listening-port=443
alt-tls-listening-port=5349

# Ephemeral Relay UDP Port Allocation Range
min-port=49152
max-port=49200

# High-concurrency worker threads
relay-threads=4

# ---- Authentication & RFC 5389 Time-Limited Credentials ---------------------
# Realm matching TurnCredentialManager.java
realm=veil-mesh.net

# Shared authentication secret for dynamic timestamp HMAC-SHA1 tokens
use-auth-secret
static-auth-secret=veil_sec_mesh_turn_2026_zero_log_prod_secret

# Disable CLI control interface for attack surface minimization
no-cli

# ---- TLS 1.3 Hardened Encryption --------------------------------------------
# Mount certificates in /etc/coturn/certs/
cert=/etc/coturn/certs/veil_turn.crt
pkey=/etc/coturn/certs/veil_turn.key

# Strictly disable legacy vulnerable TLS versions (TLS 1.3 Only)
no-tlsv1
no-tlsv1_1
no-tlsv1_2

# Modern AEAD Cipher Suites
cipher-list="ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305"

# ---- RAM-Only Quotas & Anti-Abuse -------------------------------------------
total-quota=2000
user-quota=100
bps-capacity=0
stale-nonce=600
max-allocate-lifetime=3600
channel-lifetime=600
permission-lifetime=300

# ---- Strict Peer IP Isolation (Anti-SSRF & Host Shield) ---------------------
# Deny relay traffic towards private, loopback, and cloud metadata IP ranges
no-multicast-peers
no-loopback-peers

denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.0.2.0-192.0.2.255
denied-peer-ip=192.88.99.0-192.88.99.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=198.51.100.0-198.51.100.255
denied-peer-ip=203.0.113.0-203.0.113.255
denied-peer-ip=224.0.0.0-239.255.255.255
denied-peer-ip=240.0.0.0-255.255.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
