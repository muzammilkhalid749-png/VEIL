version: '3.8'

services:
  veil-turn-edge:
    image: coturn/coturn:latest
    container_name: veil-turn-edge
    restart: always
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_BIND_SERVICE
    volumes:
      - ./turnserver.conf:/etc/coturn/turnserver.conf:ro
      - ./certs:/etc/coturn/certs:ro
    environment:
      - DETECT_EXTERNAL_IP=yes
    # Zero-Disk-Logging: Disable container logging daemon to prevent IP retention
    logging:
      driver: "none"
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1024M
    healthcheck:
      test: ["CMD-SHELL", "turnutils_stunclient 127.0.0.1 3478 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
